<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetSync-AI Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-text">
          <h1>LeetSync-AI</h1>
          <span class="version">v0.1.0</span>
        </div>
      </div>
      <div id="status-badge" class="badge badge-unconfigured">Setup Required</div>
    </header>

    <!-- Intro Banner (shown if unconfigured) -->
    <div id="intro-banner" class="intro-banner">
      <svg class="banner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span>Set up your API keys to start syncing solutions to GitHub.</span>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <!-- Settings Form -->
    <form id="settings-form" class="settings-form" novalidate>
      <!-- Groq API Key -->
      <div class="form-group">
        <label for="groq-api-key" class="form-label">
          Groq API Key
          <span class="required-asterisk">*</span>
        </label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="groq-api-key" 
            name="groqApiKey"
            class="form-input" 
            placeholder="gsk_..." 
            autocomplete="off"
            spellcheck="false"
            required
          />
          <button type="button" class="eye-toggle" id="toggle-groq-key" aria-label="Toggle password visibility" title="Show/Hide Key">
            <svg class="eye-icon eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon eye-on hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="helper-text">
          <a href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer">
            Get a free key at console.groq.com &rarr;
          </a>
        </div>
      </div>

      <!-- GitHub Personal Access Token -->
      <div class="form-group">
        <label for="github-token" class="form-label">
          GitHub Personal Access Token
          <span class="required-asterisk">*</span>
        </label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="github-token" 
            name="githubToken"
            class="form-input" 
            placeholder="ghp_..." 
            autocomplete="off"
            spellcheck="false"
            required
          />
          <button type="button" class="eye-toggle" id="toggle-github-token" aria-label="Toggle password visibility" title="Show/Hide Token">
            <svg class="eye-icon eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon eye-on hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="helper-text">
          <a href="https://github.com/settings/tokens" target="_blank" rel="noopener noreferrer">
            Generate one at github.com/settings/tokens &rarr;
          </a>
        </div>
      </div>

      <!-- GitHub Repository -->
      <div class="form-group">
        <label for="github-repo" class="form-label">
          GitHub Repository
          <span class="required-asterisk">*</span>
        </label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="github-repo" 
            name="githubRepo"
            class="form-input" 
            placeholder="username/leetcode-solutions" 
            autocomplete="off"
            spellcheck="false"
            required
          />
        </div>
        <div class="helper-text secondary">
          Format: <code>owner/repo</code> (e.g. <code>octocat/leetcode-solutions</code>)
        </div>
      </div>

      <!-- Submit Button -->
      <div class="form-actions">
        <button type="submit" id="save-btn" class="save-btn">
          <span class="btn-text">Save Settings</span>
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <script src="popup.js"></script>
</body>
</html>
